title: Ultimate Envelopes
description: Envelope budgeting built entirely in Google Sheets
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "mint"

url: "https://www.ultimateenvelopes.com"
baseurl: ""
permalink: pretty

search: true

author:
  name: "Ultimate Envelopes"
  email: "support@ultimateenvelopes.com"

footer:
  links:
    - label: "Privacy Policy"
      url: /privacy/
    - label: "Terms of Service"
      url: /terms/
    - label: "Email Support"
      url: "mailto:support@ultimateenvelopes.com"

# SEO
og_image: /assets/images/og-image.png

# Defaults — all pages get single layout + docs sidebar
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      sidebar:
        nav: "docs"

plugins:
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
